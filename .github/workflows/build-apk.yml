name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testes dos módulos de regras
        run: gradle :core:test :finance-engine:test :ai:test :integrations:test :reports:test :backup:test

      - name: Gerar APK de teste
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jfp-finance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
